name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

# The Pages build doesn't need the upstream Nx Cloud workspace (nxCloudId in nx.json),
# and unauthenticated access to it is rejected, which aborts every nx command.
env:
  NX_NO_CLOUD: 'true'

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static UI
    runs-on: ubuntu-latest
    # Fail fast on a hung build instead of holding the concurrency slot for the 6h default.
    # The build step retries internally, so allow headroom for up to three 5-minute attempts
    # plus dependency install and artifact upload.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # 24.18.0 segfaults during Nx startup on ubuntu-latest before copy-assets runs.
          # Keep Pages on the last known-good Node 24 patch until Nx/Node catches up.
          node-version: '24.16.0'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set build metadata
        run: |
          echo "VITE_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Build React Router app
        env:
          GITHUB_PAGES: 'true'
          TAU_API_URL: https://api.taucad.dev
          TAU_FRONTEND_URL: https://3dd.ahmadjalil.com/tau
          TAU_WEBSOCKET_URL: wss://api.taucad.dev
          TAU_DISABLE_CODE_EDITOR: 'true'
          # Match the canonical Nx build (apps/ui/project.json): the client bundle
          # needs >default heap, and full client source maps cause OOM/GC-thrash hangs.
          NODE_OPTIONS: '--max-old-space-size=8192'
        # Keep a bounded retry guard around the static Pages build. A healthy build finishes
        # well under 5 minutes; if this regresses, print the failing command log outside the
        # collapsed retry group so the Actions summary contains the actual build error.
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            log_file="${RUNNER_TEMP}/react-router-build-${attempt}.log"

            echo "::group::React Router build attempt ${attempt}/3"
            set +e
            timeout 300 pnpm nx build ui 2>&1 | tee "${log_file}"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "::endgroup::"
              echo "Build succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "::endgroup::"
            echo "::warning::Build attempt ${attempt} failed or timed out (exit ${status}); retrying."
            echo "Last 200 lines from failed React Router build attempt ${attempt}:"
            tail -n 200 "${log_file}"
            rm -rf build
          done

          echo "::error::React Router build failed after 3 attempts."
          exit 1

      - name: Mirror public assets under /tau
        working-directory: apps/ui
        run: |
          mkdir -p build/client/tau
          cp -R build/client/android-chrome-192x192.png build/client/tau/
          cp -R build/client/android-chrome-512x512.png build/client/tau/
          cp -R build/client/apple-touch-icon.png build/client/tau/
          cp -R build/client/favicon.ico build/client/tau/
          cp -R build/client/favicon.svg build/client/tau/
          cp -R build/client/favicon-96x96.png build/client/tau/
          cp -R build/client/version.json build/client/tau/
          cp -R build/client/version.js build/client/tau/

      - name: Add custom-domain root redirect
        working-directory: apps/ui
        run: |
          cat > build/client/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=/tau/">
              <title>Tau CAD Gallery</title>
              <script>globalThis.location.replace('/tau/' + globalThis.location.search + globalThis.location.hash);</script>
            </head>
            <body>
              <a href="/tau/">Open Tau CAD Gallery</a>
            </body>
          </html>
          HTML

      - name: Prepare Pages artifact
        run: |
          node --import @oxc-node/core/register apps/ui/scripts/check-client-bundle-budget.mts
          find apps/ui/build/client -type f -name '*.map' -delete
          touch apps/ui/build/client/.nojekyll
          printf '3dd.ahmadjalil.com\n' > apps/ui/build/client/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/ui/build/client

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
