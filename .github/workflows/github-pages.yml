name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NX_DAEMON: 'false'
  pnpm_config_verify_deps_before_run: error

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static gallery
    if: ${{ github.repository == 'ahzs645/tau' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Validate gallery
        run: pnpm nx run-many -p gallery -t typecheck,test --parallel=1
      - name: Build gallery
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm nx run gallery:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/gallery/dist

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.repository == 'ahzs645/tau' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
