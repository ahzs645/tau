name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Run against any branch on demand, without opening a pull request first.
  workflow_dispatch:

# The fork does not use the upstream Nx Cloud workspace (nxCloudId in nx.json),
# and unauthenticated access to it is rejected, which aborts every nx command.
env:
  NX_NO_CLOUD: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this job asks: did the fork's own work break anything?
  #
  # The tree this fork forked from does not pass its own lint, typecheck, or
  # test suites — upstream runs `nx affected` behind an Nx Cloud remote cache,
  # so the rot in projects a change does not touch never gets re-run there. On
  # the fork it does, and the result was a check that had never once been green.
  # The fork also cannot fix most of it: `packages/`, `kernels/`, `libs/` and
  # the shared `apps/ui` surface are upstream's, and editing them costs a rebase
  # conflict plus an upstream PR (docs/policy/fork-overlay-policy.md).
  #
  # So the targets carrying inherited breakage are held back here — by name
  # where the set is small and stable (build, typecheck, test), by scoping to
  # fork-owned paths where it is neither (lint) — and all of it runs unblocking
  # in `upstream-drift` below. Everything else, including the gallery build and
  # the playground overlay the fork exists for, is required to pass.
  verify:
    name: Test, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The `ui:build` prerender boots the SSR loaders, which validate this
      # schema (apps/ui/app/environment.config.ts) and hard-fail when it is
      # unset. Same values the Pages deploy builds with (github-pages.yml).
      TAU_API_URL: https://api.taucad.dev
      TAU_FRONTEND_URL: https://3dd.ahmadjalil.com
      TAU_WEBSOCKET_URL: wss://api.taucad.dev
      TAU_DISABLE_CODE_EDITOR: 'true'
      # Match the canonical Nx build (apps/ui/project.json): the client bundle
      # needs more than the default heap.
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # nx-set-shas needs history to work out the affected base.
          fetch-depth: 0

      - name: Setup Nx environment
        uses: ./.github/actions/setup-nx

      - name: Provision kernel assets
        # Kernel wasm and OpenSCAD fonts are copied, not committed; without this
        # both the OCCT and OpenSCAD suites fail silently.
        run: pnpm nx run-many -t copy-assets

      - name: Build affected projects
        # example-electron: the OCCT wasm modules use top-level await and vite
        # bundles the kernel worker as `iife`, which cannot represent it.
        run: pnpm nx affected --targets=build --exclude=example-electron

      - name: Typecheck affected projects
        # api: `@morphllm/morphsdk` renamed `instructions` to `instruction` and
        # the pinned version no longer matches its call site in file-edit.service.ts.
        run: pnpm nx affected --targets=typecheck --exclude=api

      - name: Test affected projects
        # ui: 22 inherited failures (tiptap editor, TSL material snapshots,
        # use-chat). The playground overlay is covered by its own step below.
        # oxlint: require-using-on-disposable fails on the fork base too.
        run: pnpm nx affected --targets=test --exclude=ui,oxlint

      - name: Lint fork-owned code
        # Lint is the one target that cannot be run tree-wide here. The
        # inherited rot is not confined to a listable set of projects — ui, api,
        # runtime, types, memory, filesystem and oxlint all fail on upstream
        # files today, and the next sync can add more — so an exclusion list
        # would go stale into a red check the fork cannot fix. Lint therefore
        # blocks on the paths the fork actually owns, and the whole workspace is
        # linted unblocking in `upstream-drift`.
        #
        # Overlay paths per docs/policy/fork-overlay-policy.md, plus the
        # fork-added tooling that lives inside otherwise-core packages. Keep in
        # step with `overlayPrefixes` in scripts/src/check-overlay-boundary.mts.
        run: |
          FORK_PATHS="apps/ui/app/routes/playground apps/ui-e2e/thumbnails packages/testing/scripts kernels/openscad/scripts"
          pnpm exec oxlint -c .oxlintrc.json ${FORK_PATHS}
          pnpm exec eslint ${FORK_PATHS}

      - name: Test the playground overlay
        # The fork's own slice of apps/ui, which the `ui` test exclusion above
        # would otherwise take with it.
        working-directory: apps/ui
        run: pnpm exec vitest run app/routes/playground

  # Advisory: the targets `verify` excludes, run in full so inherited breakage
  # stays visible (and so it is obvious when an upstream sync fixes one and the
  # exclusion above can go). Never blocks a merge.
  upstream-drift:
    name: Upstream drift (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Nx environment
        uses: ./.github/actions/setup-nx

      - name: Provision kernel assets
        run: pnpm nx run-many -t copy-assets

      - name: Report inherited failures
        run: |
          pnpm nx affected --targets=lint
          pnpm nx affected --targets=typecheck --projects=api
          pnpm nx affected --targets=test --projects=ui,oxlint
          pnpm nx affected --targets=build --projects=example-electron

  overlay-boundary:
    name: Fork overlay boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: reports core-package edits so they get an upstream follow-up.
    # See docs/policy/fork-overlay-policy.md.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Nx environment
        uses: ./.github/actions/setup-nx

      - name: Report core-package edits
        run: node --import tsx scripts/src/check-overlay-boundary.mts origin/${{ github.base_ref }}
