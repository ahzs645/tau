name: Upstream drift

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  compare:
    if: ${{ github.repository == 'ahzs645/tau' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the selected fork revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Compare actual upstream history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/taucad/tau.git main:refs/remotes/upstream/main
          read -r ahead behind < <(git rev-list --left-right --count HEAD...refs/remotes/upstream/main)
          {
            echo '## Upstream comparison'
            echo
            echo "Fork revision: $(git rev-parse HEAD)"
            echo "Upstream revision: $(git rev-parse refs/remotes/upstream/main)"
            echo "Fork-only commits: $ahead"
            echo "Upstream-only commits: $behind"
            echo
            echo 'See apps/gallery/MIGRATION.md for the integration and validation procedure.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$behind" -gt 0 ]; then
            echo "::warning::The fork is behind upstream by $behind commits."
          fi
